name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck web (DOM lib — excluded from root tsconfig)
        run: npx tsc --noEmit -p packages/web/tsconfig.json
      - run: npm test
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm workspace flag: run the web package's own "build" (vite build)
      # from packages/web so index.html resolves. NOTE: `vite --config`
      # from the repo root would fail (entry resolves relative to CWD), and
      # `-w` means --watch under bun (use --filter there instead).
      - name: Build web dashboard (vite)
        run: npm run build -w @oresund/web
      - name: Verify collector workspace typechecks
        run: npm run typecheck
      - name: Build shared types
        run: npx tsc --noEmit -p packages/shared || true
