name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck web (DOM lib — excluded from root tsconfig)
        run: npx tsc --noEmit -p packages/web/tsconfig.json
      - run: npm test
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web dashboard (vite)
        run: npx vite build --config packages/web/vite.config.ts
      - name: Verify collector workspace typechecks
        run: npm run typecheck
      - name: Build shared types
        run: npx tsc --noEmit -p packages/shared || true
