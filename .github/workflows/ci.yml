name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase 1: nothing to bundle yet (collector Worker = Phase 2, web = Phase 3).
      # Typecheck in the test job is the current build gate. As packages gain
      # real build targets (wrangler deploy --dry-run, vite build), add them here.
      - name: Verify workspace typechecks
        run: npm run typecheck
      - name: Build shared types
        run: npx tsc --noEmit -p packages/shared || true
