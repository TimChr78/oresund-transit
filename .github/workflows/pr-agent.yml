name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent_job:
    # run on PR events, and on comment events only when the comment is a pr-agent command
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        id: pragent
        uses: The-PR-Agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BYOK: qwen3.8-flash via DashScope's OpenAI-compatible endpoint
          OPENAI_API_KEY: ${{ secrets.PR_AGENT_KEY }}
          OPENAI_API_BASE: ${{ secrets.PR_AGENT_BASE }}
          CONFIG.MODEL: "openai/qwen3.8-flash"
          CONFIG.FALLBACK_MODELS: ""
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "8192"
          PR_REVIEWER.MAX_DESCRIPTION_TOKENS: "1000"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on functional correctness, security (XSS, injection), CSS cascade/specificity bugs, and test coverage of new behavior. This is a TypeScript monorepo (packages/web, packages/collector); vanilla DOM + Vitest. Be concise; skip style nitpicks."
