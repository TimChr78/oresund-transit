name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    # Run on PR events, and on comment events only for maintainers on a pull request.
    # Fork PRs get the event but no secrets, so they are not auto-reviewed; a maintainer
    # can comment /review on the base repository instead (PR-Agent reads the diff via the API).
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: PR Agent action step
        id: pragent
        # v0.49.0, pinned to the commit SHA rather than a moving tag.
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BYOK: DeepSeek V4.1 Flash through CommandCode's OpenAI-compatible Provider API.
          # Replace PR_AGENT_KEY with a CommandCode API key (Studio -> API keys).
          OPENAI_API_KEY: ${{ secrets.PR_AGENT_KEY }}
          OPENAI_API_BASE: https://api.commandcode.ai/provider/v1
          CONFIG.MODEL: "openai/deepseek/deepseek-v4.1-flash"
          CONFIG.FALLBACK_MODELS: ""
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "16384"
          PR_REVIEWER.MAX_DESCRIPTION_TOKENS: "1000"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on functional correctness, security (XSS, injection), CSS cascade/specificity bugs, and test coverage of new behavior. This is a TypeScript monorepo (packages/web, packages/collector); vanilla DOM + Vitest. Be concise; skip style nitpicks."
