    <!-- Structured data: WebSite + Organization, factual only (name/url/description). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://oresund.live/#website",
            "name": "Øresund.live",
            "url": "https://oresund.live/",

  <body>
    <div id="app"></div>
    <div id="static-shell" class="wrap">
      <!--
        No-JS / crawler fallback: the dashboard itself is client-rendered, so
        the SEO-critical lead (H1 with Øresundståg + train wording) is shipped
        in the initial HTML. boot() removes this element on startup and renders
        the live board into #app; the static routes remove it via prerender.
      -->
      <header class="topbar">
        <div class="brand">Øresund <span class="brand-sub">live</span></div>
        <span class="board-label">Hyllie ↔ København H</span>
      </header>
      <h1 class="lead">Live Øresundståg / train departures Hyllie ↔ København H — delays, cancellations, alerts every 5 min (Trafiklab).</h1>
    </div>
    <footer class="site-footer">

        <a href="/line">Line archives</a>

        <a href="/da/" lang="da" hreflang="da">DA</a>
      </nav>
    </footer>
    <noscript>
      <p lang="sv">Den här sidan kräver JavaScript för att visa avgångstavlan.</p>
      <p lang="da">Denne side kræver JavaScript for at vise afgangstavlen.</p>
      <p lang="en">This page requires JavaScript to show the departure board.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Deploy-race self-heal: if the SPA never boots within 6s (typically a
      // module load failure while a new deployment propagates), reload once.
      // sessionStorage guard prevents reload loops.
      (function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && app.children.length === 0 && !sessionStorage.getItem('oresund-reloaded')) {
            sessionStorage.setItem('oresund-reloaded', '1');
            location.reload();
          }
        }, 6000);
      })();
    </script>
  </body>
